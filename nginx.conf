# =============================================================================
# nginx.conf — Reverse proxy for AI Resume Analyzer Pro
# =============================================================================
# Uncomment the nginx service in docker-compose.yml to use this.
# =============================================================================

upstream flask_app {
    server web:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ---------- Static files ----------
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Uploads ----------
    location /uploads/ {
        alias /app/uploads/;
        internal;  # Not directly accessible — served via Flask send_from_directory
    }

    # ---------- Flask Application ----------
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

