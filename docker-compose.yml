# =============================================================================
# docker-compose.yml — AI Resume Analyzer Pro
# =============================================================================
# Usage (development):
#   docker compose up --build
#
# Usage (production):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # Flask Application
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-resume-analyzer:latest
    container_name: ai-resume-web
    restart: unless-stopped

    ports:
      - "${PORT:-5000}:5000"

    env_file:
      - .env

    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      # Override DB to point to PostgreSQL
      DATABASE_URL: "postgresql://${POSTGRES_USER:-resumeuser}:${POSTGRES_PASSWORD:-resumepass}@db:5432/${POSTGRES_DB:-resumeanalyzer}"

    volumes:
      # Mount source code for live reload in development
      - .:/app
      # Persistent uploads directory
      - uploads_data:/app/uploads
      # Persistent instance data (SQLite fallback, migrations)
      - instance_data:/app/instance

    depends_on:
      db:
        condition: service_healthy

    # Override command for development (Flask dev server with auto-reload)
    command: >
      sh -c "flask db upgrade && python run.py"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - app-network

  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ai-resume-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumepass}
      POSTGRES_DB: ${POSTGRES_DB:-resumeanalyzer}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumeuser} -d ${POSTGRES_DB:-resumeanalyzer}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  # --------------------------------------------------------------------------
  # (Optional) Nginx Reverse Proxy — uncomment for production
  # --------------------------------------------------------------------------
  # nginx:
  #   image: nginx:alpine
  #   container_name: ai-resume-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - static_assets:/app/static:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - app-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  instance_data:
    driver: local
  # static_assets:
  #   driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  app-network:
    driver: bridge

