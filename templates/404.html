{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 text-center">
    <div class="card shadow-sm rounded-4 p-5 bg-white">
      <span class="eyebrow mb-3">Oops</span>
      <h1 class="display-4 text-primary mb-3">404</h1>
      <p class="lead text-muted mb-4">We couldn't find the page you were looking for. Try heading back to the dashboard or homepage.</p>
      <div class="d-flex justify-content-center gap-3">
        <a class="btn btn-primary" href="{{ url_for('main.index') }}">Home</a>
        {% if current_user.is_authenticated %}
          <a class="btn btn-outline-primary" href="{{ url_for('dashboard.dashboard_home') }}">Dashboard</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
